[package]
name = "dyneeded"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
codegen-units = 1
strip = true

[dependencies]
clap = {version = "=4.6.6", features = ["derive"]}
lief = "=1.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ron = "=0.12.2"
termtree = "=1.0.0"
anyhow = "=1.0.104"
comfy-table = "=8.0.0"