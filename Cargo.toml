[package]
name = "dyneeded"
description = "A better, fancier, cross platform LDD"
version = "0.5.3"
edition = "2024"
repository = "https://github.com/barbeldotorg/dyneeded"
homepage = "https://github.com/barbeldotorg/dyneeded"
authors = ["Barbel"]
license = "AGPL-3"

[package.metadata.wix]
upgrade-guid = "79AEFAC8-051C-43B6-8098-78F479ABE955"
path-guid = "4F3A5FA1-FBE4-4499-BEA5-E045C67D5C32"
license = false
eula = false

[profile.release]
opt-level = 3
codegen-units = 1
strip = true
lto = "fat"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"

[package.metadata.dist.mac-pkg-config]
identifier = "org.barbel.dyneeded"

[dependencies]
clap = {version = "=4.6.6", features = ["derive"]}
lief = "=1.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ron = "=0.12.2"
termtree = "=1.0.0"
anyhow = "=1.0.104"
comfy-table = "=8.0.0"
owo-colors = {version = "=4.4.0", features = ["supports-colors"]}
fastrand = "=2.5.0"