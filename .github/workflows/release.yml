name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  BIN_NAME: dyneeded
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Native binaries for every platform (raw binary + tar.gz/zip archive)
  # ---------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Native arm64 runner - no cross/QEMU needed, important since
          # `lief` builds a native C++ library and cross-builds of that
          # are fragile.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps (lief needs cmake/clang)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang build-essential

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist archive_root
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          SRC="target/${{ matrix.target }}/release/${BIN_NAME}${EXT}"
          # Raw binary, target-qualified name, for direct release upload
          cp "$SRC" "dist/${BIN_NAME}-${{ matrix.target }}${EXT}"
          # Plain-named copy, for the archive so it extracts cleanly
          cp "$SRC" "archive_root/${BIN_NAME}${EXT}"

      - name: Create archive
        shell: bash
        run: |
          set -euo pipefail
          cd archive_root
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../dist/${BIN_NAME}-${{ matrix.target }}.zip" *
          else
            tar czf "../dist/${BIN_NAME}-${{ matrix.target }}.tar.gz" *
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # .deb
  # ---------------------------------------------------------------------
  deb:
    name: Build .deb
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake clang build-essential
      - run: cargo install cargo-deb --locked
      - name: Build deb
        run: |
          mkdir -p dist
          cargo deb -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: package-deb
          path: dist/*.deb

  # ---------------------------------------------------------------------
  # .rpm
  # ---------------------------------------------------------------------
  rpm:
    name: Build .rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake clang build-essential
      - run: cargo build --release --locked
      - run: cargo install cargo-generate-rpm --locked
      - name: Build rpm
        run: |
          mkdir -p dist
          cargo generate-rpm -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: package-rpm
          path: dist/*.rpm

  # ---------------------------------------------------------------------
  # AppImage
  # ---------------------------------------------------------------------
  appimage:
    name: Build AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y cmake clang build-essential imagemagick
      - run: cargo build --release --locked

      - name: Assemble AppDir
        run: |
          set -euo pipefail
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp "target/release/${BIN_NAME}" "$APPDIR/usr/bin/"

          cat > "$APPDIR/usr/share/applications/${BIN_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=dyneeded
          Comment=Inspect and report needed dynamic dependencies
          Exec=dyneeded
          Icon=dyneeded
          Categories=Utility;Development;
          Terminal=true
          EOF

          # Drop packaging/icon.png (256x256) into the repo for a real icon.
          # Falls back to a generated placeholder so the build never breaks.
          if [ -f packaging/icon.png ]; then
            cp packaging/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/${BIN_NAME}.png"
          else
            convert -size 256x256 xc:'#2b2b2b' -gravity center -pointsize 42 \
              -fill white -annotate 0 "dy" \
              "$APPDIR/usr/share/icons/hicolor/256x256/apps/${BIN_NAME}.png"
          fi

      - name: Download linuxdeploy + appimagetool
        run: |
          curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy appimagetool

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # GH runners lack FUSE
        run: |
          set -euo pipefail
          ./linuxdeploy --appdir AppDir --output appimage
          mkdir -p dist
          mv *.AppImage "dist/${BIN_NAME}-${{ github.ref_name }}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: package-appimage
          path: dist/*.AppImage

  # ---------------------------------------------------------------------
  # macOS .dmg (universal binary)
  # ---------------------------------------------------------------------
  dmg:
    name: Build .dmg (universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          set -euo pipefail
          mkdir -p universal dmgroot dist
          lipo -create \
            "target/x86_64-apple-darwin/release/${BIN_NAME}" \
            "target/aarch64-apple-darwin/release/${BIN_NAME}" \
            -output "universal/${BIN_NAME}"
          cp "universal/${BIN_NAME}" dmgroot/
          [ -f README.md ] && cp README.md dmgroot/ || true
          ln -s /usr/local/bin "dmgroot/Drag here to install"

      - name: Build dmg
        run: |
          hdiutil create -volname "dyneeded" -srcfolder dmgroot -ov -format UDZO \
            "dist/${BIN_NAME}-${{ github.ref_name }}-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: package-dmg
          path: dist/*.dmg

  # ---------------------------------------------------------------------
  # Arch pkg.tar.zst (hand-written PKGBUILD)
  # ---------------------------------------------------------------------
  pkg-arch:
    name: Build pkg.tar.zst
    runs-on: ubuntu-22.04
    container: archlinux:latest
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake clang rust sudo pacman-contrib

      - uses: actions/checkout@v4

      - name: Prep unprivileged build user
        # makepkg refuses to run as root
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Set pkgver from tag and refresh checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          chown -R builder:builder .
          su builder -c "updpkgsums"

      - name: makepkg
        run: |
          su builder -c "makepkg -s --noconfirm"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv *.pkg.tar.zst "$GITHUB_WORKSPACE/dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: package-arch
          path: dist/*.pkg.tar.zst

  # ---------------------------------------------------------------------
  # Publish everything to the GitHub Release for this tag
  # ---------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build, deb, rpm, appimage, dmg, pkg-arch]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
